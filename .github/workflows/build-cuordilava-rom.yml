name: Build Cuordilava test ROM
# Trigger build per testare Cuordilava nell'emulatore

on:
  workflow_dispatch:
  push:
    branches:
      - feature/daytime-cyberpunk-lights

permissions:
  contents: read

jobs:
  build-rom:
    name: Compile and verify Cuordilava test ROM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install ROM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Apply town-private industrial architecture redraw
        run: python3 tools/apply_cuordilava_industrial_art.py

      - name: Validate cyberpunk assets
        run: python3 tools/validate_cyberpunk_assets.py

      - name: Compile Pokémon Emerald
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Verify ROM and generate checksum
        run: |
          test -s pokeemerald.gba
          sha256sum pokeemerald.gba > pokeemerald.gba.sha256
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "game=Pokemon Emerald Expansion"
            echo "region=English"
            echo "town=Cuordilava (Lavaridge Town)"
          } > cuordilava-build-info.txt

      - name: Render Cuordilava day/night layout previews
        run: python3 tools/render_cuordilava_preview.py --output-dir build-preview

      - name: Render indexed seam/alignment close-ups for all seven landmarks
        run: python3 tools/render_cuordilava_detail_sheet.py --input-dir build-preview --output-dir build-preview

      - name: Inspect actual thermal pool exterior bank in day and night
        run: python3 tools/render_cuordilava_pool_audit.py --input-dir build-preview --output-dir build-preview

      - name: Upload ROM, diagnostics and tile sources
        uses: actions/upload-artifact@v4
        with:
          name: cuordilava-pokeemerald-${{ github.sha }}
          path: |
            pokeemerald.gba
            pokeemerald.gba.sha256
            cuordilava-build-info.txt
            build-preview/cuordilava-day.png
            build-preview/cuordilava-night.png
            build-preview/cuordilava-landmark-alignment.png
            build-preview/cuordilava-landmark-alignment.json
            build-preview/cuordilava-thermal-perimeter-day.png
            build-preview/cuordilava-thermal-perimeter-night.png
            build-preview/cuordilava-thermal-perimeter.json
            data/tilesets/secondary/cuordilava/tiles.png
            data/tilesets/secondary/cuordilava/metatiles.bin
            data/tilesets/secondary/cuordilava/metatile_attributes.bin
            data/layouts/LavaridgeTown/map.bin
            data/tilesets/primary/cuordilava/tiles.png
            data/tilesets/primary/general/tiles.png
            data/tilesets/primary/general/metatiles.bin
          if-no-files-found: error
          retention-days: 14
